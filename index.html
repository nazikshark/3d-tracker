<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>Filament</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Filament">
<meta name="theme-color" content="#0B0B0F">
<meta name="msapplication-TileImage" content="logo.jpeg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/jpeg" href="logo.jpeg">
<link rel="apple-touch-icon" href="logo.jpeg">
<link rel="apple-touch-icon-precomposed" href="logo.jpeg">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --bg:#0B0B0F;
    --bg2:#121216;
    --surface: rgba(255,255,255,0.055);
    --surface-strong: rgba(255,255,255,0.09);
    --stroke: rgba(255,255,255,0.09);
    --orange:#FF6A13;
    --orange2:#FF8A3D;
    --green:#34C759;
    --amber:#FF9F0A;
    --red:#FF3B30;
    --text:#F5F5F7;
    --sub:#9A9AA2;
  }
  *{ -webkit-tap-highlight-color: transparent; box-sizing:border-box; }
  html,body{
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(255,106,19,0.14), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    overscroll-behavior-y: none;
    height:100%;
  }
  body{ padding-top: env(safe-area-inset-top); }
  ::-webkit-scrollbar{ display:none; }
  .glass{
    background: var(--surface);
    border: 1px solid var(--stroke);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
  }
  .glass-strong{
    background: var(--surface-strong);
    border: 1px solid var(--stroke);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
  }
  .card-armed{ transform: scale(0.96); transition: transform .18s ease; filter: brightness(1.05); }
  .card-ghost{ opacity: 0.28; }
  .drop-highlight{
    outline: 2px dashed var(--orange);
    outline-offset: -2px;
    background: rgba(255,106,19,0.08) !important;
  }
  .drag-clone{
    position: fixed;
    top:0; left:0;
    z-index: 9999;
    pointer-events: none;
    transform-origin: center;
    box-shadow: 0 24px 48px rgba(0,0,0,0.55);
    transition: none;
  }
  .pulse-red{ animation: pulseRed 1.6s ease-in-out infinite; }
  @keyframes pulseRed{
    0%,100%{ box-shadow: 0 0 0 0 rgba(255,59,48,0.5); }
    50%{ box-shadow: 0 0 0 6px rgba(255,59,48,0); }
  }
  .sheet{ transition: transform .38s cubic-bezier(.32,.72,0,1); }
  .sheet-hidden{ transform: translateY(100%); }
  .fade{ transition: opacity .25s ease; }
  .menu-pop{
    transition: transform .16s cubic-bezier(.32,.72,0,1), opacity .16s ease;
    transform-origin: top center;
  }
  .btn-press:active{ transform: scale(0.96); }
  .toast{ transition: transform .35s cubic-bezier(.32,.72,0,1), opacity .35s ease; }
  input[type="color"]{ -webkit-appearance: none; appearance: none; border:none; padding:0; background:none; }
  input[type="color"]::-webkit-color-swatch-wrapper{ padding:0; }
  input[type="color"]::-webkit-color-swatch{ border:none; border-radius:12px; }
  .seg-btn{ transition: all .15s ease; }
  .seg-btn.active{ background: var(--orange); color:#0B0B0F; font-weight:600; }
  .empty-slot{ border: 1.5px dashed rgba(255,255,255,0.16); }

  /* Storage: 4 per row */
  .spool-grid{
    display:grid;
    grid-template-columns: repeat(4, minmax(0,1fr));
    gap: 8px;
  }
  /* Slots: 2x2, filled column by column:
     1 = top-left, 2 = bottom-left, 3 = top-right, 4 = bottom-right */
  .slots-grid{
    display:grid;
    grid-template-columns: repeat(2, minmax(0,1fr));
    grid-template-rows: repeat(2, auto);
    grid-auto-flow: column;
    gap: 10px;
  }
  .spool-card{ position:relative; height:130px; touch-action:none; }
  .spool-flange-abs{
    position:absolute; top:50%; transform:translateY(-50%);
    width:5px; height:118px;
    background:linear-gradient(180deg,#fff,#d8d8dd);
    border-radius:4px; box-shadow:0 1px 2px rgba(0,0,0,0.4);
  }
  .info-block{
    position:absolute; top:50%; left:11px; right:11px; height:100px;
    transform:translateY(-50%);
    display:flex; flex-direction:column; justify-content:space-between;
    padding:7px; border-radius:12px; overflow:hidden;
  }
  /* Silk: animated sheen over the filament block */
  .silk-shine{
    position:absolute; inset:0; pointer-events:none; border-radius:inherit;
    background:
      linear-gradient(115deg, transparent 25%, rgba(255,255,255,0.55) 48%, rgba(255,255,255,0.12) 56%, transparent 72%);
    background-size: 260% 100%;
    background-position: 130% 0;
    mix-blend-mode: soft-light;
    animation: silkSweep 3.6s ease-in-out infinite;
  }
  .silk-shine::after{
    content:""; position:absolute; inset:0; border-radius:inherit;
    background: linear-gradient(180deg, rgba(255,255,255,0.28), transparent 45%, rgba(0,0,0,0.14));
  }
  @keyframes silkSweep{
    0%{ background-position: 130% 0; }
    55%,100%{ background-position: -40% 0; }
  }
  .silk-btn{ transition: all .15s ease; }
  .silk-btn.active{
    background: linear-gradient(135deg, #FFD60A, #FF9F0A);
    color:#0B0B0F; font-weight:600; border-color: transparent;
  }
  .palette-grid{
    display:grid;
    grid-template-columns: repeat(8, minmax(0,1fr));
    gap: 8px;
    max-height: 176px;
    overflow-y: auto;
    padding: 4px;
  }
  .palette-swatch{
    aspect-ratio: 1 / 1;
    border-radius: 9999px;
    border: 1px solid rgba(255,255,255,0.22);
  }
  .palette-swatch.selected{
    outline: 2px solid var(--orange);
    outline-offset: 2px;
  }
</style>
</head>
<body class="min-h-screen select-none">

<!-- HEADER -->
<div class="sticky top-0 z-30 px-4 pt-3 pb-2" style="padding-top:calc(env(safe-area-inset-top) + 10px);">
  <h1 class="text-2xl font-bold tracking-tight">Филамент</h1>
  <p class="text-xs" style="color:var(--sub)">Слоты и склад катушек</p>
</div>

<!-- SLOTS PANEL -->
<div class="px-4 mt-2">
  <div id="slotsZone" data-dropzone="slots" class="glass-strong rounded-3xl p-3 transition-colors duration-150">
    <div class="flex items-center justify-between mb-2.5 px-1">
      <div class="flex items-center gap-2">
        <div class="w-2 h-2 rounded-full" style="background:var(--orange)"></div>
        <span class="text-sm font-semibold tracking-wide">Слоты</span>
      </div>
      <span id="slotsCount" class="text-xs" style="color:var(--sub)">0 / 4</span>
    </div>
    <div id="slotsGrid" class="slots-grid"></div>
  </div>
</div>

<!-- STORAGE -->
<div class="px-4 mt-6 pb-32">
  <div class="flex items-center justify-between mb-2.5 px-1">
    <div class="flex items-center gap-2">
      <div class="w-2 h-2 rounded-full" style="background:var(--sub)"></div>
      <span class="text-sm font-semibold tracking-wide">Склад</span>
    </div>
    <span id="storageCount" class="text-xs" style="color:var(--sub)">0 катушек</span>
  </div>
  <div id="storageZone" data-dropzone="storage" class="spool-grid min-h-[140px] rounded-3xl p-1 transition-colors duration-150"></div>
  <div id="emptyState" class="hidden flex flex-col items-center justify-center py-16 text-center" style="color:var(--sub)">
    <div class="text-4xl mb-2">🧵</div>
    <p class="text-sm">Склад пуст.<br>Добавьте первую катушку.</p>
  </div>
</div>

<!-- BOTTOM ADD BUTTON -->
<div class="fixed left-0 right-0 bottom-0 z-30 px-4" style="padding-bottom:calc(env(safe-area-inset-bottom) + 14px); padding-top:10px; background:linear-gradient(0deg, var(--bg) 55%, transparent);">
  <button id="addBtn" class="btn-press w-full py-4 rounded-2xl text-base font-semibold flex items-center justify-center gap-2"
    style="background:var(--orange); color:#0B0B0F; box-shadow:0 10px 28px rgba(255,106,19,0.35);">
    <span class="text-xl leading-none">+</span><span>Добавить катушку</span>
  </button>
</div>

<!-- CONTEXT MENU -->
<div id="menuOverlay" class="fixed inset-0 z-40 hidden"></div>
<div id="ctxMenu" class="fixed z-50 hidden menu-pop glass-strong rounded-2xl overflow-hidden w-52" style="opacity:0; transform:scale(.9);">
  <button data-action="slot" class="w-full text-left px-4 py-3 text-sm flex items-center gap-3 active:bg-white/10">
    <span class="w-5 text-center">📦</span><span id="ctxSlotLabel">Поместить в слот</span>
  </button>
  <div class="h-px bg-white/10"></div>
  <button data-action="dry" class="w-full text-left px-4 py-3 text-sm flex items-center gap-3 active:bg-white/10">
    <span class="w-5 text-center">☀️</span><span>Просушить</span>
  </button>
  <div class="h-px bg-white/10"></div>
  <button data-action="edit" class="w-full text-left px-4 py-3 text-sm flex items-center gap-3 active:bg-white/10">
    <span class="w-5 text-center">✏️</span><span>Изменить</span>
  </button>
  <div class="h-px bg-white/10"></div>
  <button data-action="delete" class="w-full text-left px-4 py-3 text-sm flex items-center gap-3 active:bg-white/10" style="color:var(--red)">
    <span class="w-5 text-center">🗑️</span><span>Удалить</span>
  </button>
</div>

<!-- ADD / EDIT SHEET -->
<div id="formOverlay" class="fixed inset-0 z-40 bg-black/60 hidden fade" style="opacity:0;"></div>
<div id="formSheet" class="fixed left-0 right-0 bottom-0 z-50 sheet sheet-hidden">
  <div class="glass-strong rounded-t-3xl p-5 pb-8 mx-auto max-w-md" style="background:var(--bg2); padding-bottom:calc(env(safe-area-inset-bottom) + 24px); max-height:90vh; overflow-y:auto;">
    <div class="w-10 h-1.5 rounded-full bg-white/20 mx-auto mb-4"></div>
    <h2 id="formTitle" class="text-lg font-bold mb-4">Новая катушка</h2>

    <label class="text-xs font-medium" style="color:var(--sub)">Бренд</label>
    <div id="brandGrid" class="grid grid-cols-2 gap-2 mt-1.5 mb-2">
      <button type="button" data-field="brand" data-value="SnapMaker" class="seg-btn py-2.5 rounded-xl text-sm glass">SnapMaker</button>
      <button type="button" data-field="brand" data-value="Elegoo" class="seg-btn py-2.5 rounded-xl text-sm glass">Elegoo</button>
      <button type="button" data-field="brand" data-value="Pochatok" class="seg-btn py-2.5 rounded-xl text-sm glass">Pochatok</button>
      <button type="button" data-field="brand" data-value="__custom" class="seg-btn py-2.5 rounded-xl text-sm glass">Вписать</button>
    </div>
    <div id="brandCustomWrap" class="hidden mb-4">
      <input id="brandCustom" type="text" maxlength="24" placeholder="Название бренда"
        class="w-full px-3 py-2.5 rounded-xl text-sm glass placeholder-white/30 outline-none" style="color:var(--text)">
    </div>
    <div id="brandSpacer" class="mb-2"></div>

    <label class="text-xs font-medium" style="color:var(--sub)">Материал</label>
    <div id="materialGrid" class="grid grid-cols-3 gap-2 mt-1.5 mb-1">
      <button type="button" data-field="material" data-value="PLA" class="seg-btn py-2.5 rounded-xl text-sm glass">PLA</button>
      <button type="button" data-field="material" data-value="PETG" class="seg-btn py-2.5 rounded-xl text-sm glass">PETG</button>
      <button type="button" data-field="material" data-value="ABS" class="seg-btn py-2.5 rounded-xl text-sm glass">ABS</button>
      <button type="button" data-field="material" data-value="ASA" class="seg-btn py-2.5 rounded-xl text-sm glass">ASA</button>
      <button type="button" data-field="material" data-value="TPU" class="seg-btn py-2.5 rounded-xl text-sm glass">TPU</button>
    </div>

    <div id="shoreWrap" class="hidden mb-4 mt-2">
      <label class="text-xs font-medium" style="color:var(--sub)">Твёрдость TPU</label>
      <div class="grid grid-cols-3 gap-2 mt-1.5">
        <button type="button" data-field="shore" data-value="95A" class="seg-btn py-2 rounded-xl text-sm glass">95A</button>
        <button type="button" data-field="shore" data-value="90A" class="seg-btn py-2 rounded-xl text-sm glass">90A</button>
        <button type="button" data-field="shore" data-value="85A" class="seg-btn py-2 rounded-xl text-sm glass">85A</button>
      </div>
    </div>

    <div class="mb-4 mt-4">
      <div class="flex items-center justify-between">
        <label class="text-xs font-medium" style="color:var(--sub)">Цвет</label>
        <button type="button" id="silkBtn" class="silk-btn btn-press px-3 py-1.5 rounded-full text-xs glass">✨ Silk</button>
      </div>
      <div class="flex items-center gap-3 mt-1.5">
        <input type="color" id="colorInput" value="#FF6A13" class="w-14 h-14 rounded-2xl shrink-0">
        <input id="hexInput" type="text" placeholder="#FF6A13" maxlength="7"
          class="w-28 px-3 py-2.5 rounded-xl text-sm glass placeholder-white/30 outline-none uppercase" style="color:var(--text)">
        <input id="colorName" type="text" placeholder="Название цвета"
          class="flex-1 min-w-0 px-3 py-2.5 rounded-xl text-sm glass placeholder-white/30 outline-none" style="color:var(--text)">
      </div>
      <div id="paletteGrid" class="palette-grid mt-3"></div>
    </div>

    <div class="flex gap-3 mt-6">
      <button id="formCancel" class="btn-press flex-1 py-3 rounded-2xl text-sm font-medium glass">Отмена</button>
      <button id="formSave" class="btn-press flex-1 py-3 rounded-2xl text-sm font-semibold" style="background:var(--orange); color:#0B0B0F;">Сохранить</button>
    </div>
  </div>
</div>

<!-- SLOT PICKER MODAL (used from context menu when all slots are full) -->
<div id="slotPickerOverlay" class="fixed inset-0 z-40 bg-black/60 hidden fade" style="opacity:0;"></div>
<div id="slotPickerModal" class="fixed inset-0 z-50 hidden items-center justify-center px-6">
  <div class="glass-strong rounded-3xl p-5 w-full max-w-sm" style="background:var(--bg2);">
    <h3 class="text-base font-bold mb-1">Все слоты заняты</h3>
    <p class="text-xs mb-4" style="color:var(--sub)">Выберите слот для замены</p>
    <div id="slotPickerList" class="flex flex-col gap-2"></div>
    <button id="slotPickerCancel" class="btn-press w-full mt-4 py-3 rounded-2xl text-sm font-medium glass">Отмена</button>
  </div>
</div>

<!-- TOAST -->
<div id="toast" class="fixed left-1/2 z-[9999] px-4 py-2.5 rounded-2xl text-sm font-medium glass-strong toast"
  style="bottom:calc(env(safe-area-inset-bottom) + 90px); transform:translate(-50%, 140%); opacity:0; background:var(--bg2);">
</div>

<script>
(function(){
  "use strict";

  /* ---------- CONFIG ---------- */
  var MATERIAL_DAYS = { PLA:90, PETG:120, ABS:180, ASA:180, TPU:14 };
  var BRANDS = ["SnapMaker", "Elegoo", "Pochatok"];
  var CUSTOM = "__custom";
  var DAY_MS = 24*60*60*1000;

  // Big palette: [hex, name]
  var PALETTE = [
    ["#1C1C1E","Чёрный"], ["#3A3A3C","Графит"], ["#636366","Тёмно-серый"], ["#8E8E93","Серый"],
    ["#C7C7CC","Светло-серый"], ["#F5F5F7","Белый"], ["#F2EBD9","Слоновая кость"], ["#D9C3A0","Бежевый"],

    ["#FF3B30","Красный"], ["#B3201A","Тёмно-красный"], ["#7A1626","Бордовый"], ["#FF6F61","Коралловый"],
    ["#F4B6C2","Пудровый"], ["#FF6BA8","Розовый"], ["#FF2D92","Ярко-розовый"], ["#E8B796","Телесный"],

    ["#FF6A13","Оранжевый"], ["#FF9F0A","Янтарный"], ["#D4A017","Золотистый"], ["#FFD60A","Жёлтый"],
    ["#F5F06A","Лимонный"], ["#A6E22E","Салатовый"], ["#34C759","Зелёный"], ["#1E7B3A","Тёмно-зелёный"],

    ["#6B7B3A","Хаки"], ["#808000","Оливковый"], ["#7FE5C0","Мятный"], ["#1CC8C8","Бирюзовый"],
    ["#5AC8FA","Голубой"], ["#8CCBF2","Небесный"], ["#0A84FF","Синий"], ["#1F4FD8","Кобальт"],

    ["#123B8C","Тёмно-синий"], ["#4B4ACF","Индиго"], ["#B9A7F0","Лавандовый"], ["#C58AE8","Сиреневый"],
    ["#AF52DE","Фиолетовый"], ["#8E2DA8","Пурпурный"], ["#8B5A2B","Коричневый"], ["#4E342E","Шоколадный"],

    ["#B87333","Медный"], ["#8C6A2B","Бронзовый"], ["#C0C0C8","Серебро"], ["#C9A24D","Золото"],
    ["#DDE7EA","Прозрачный"], ["#39FF14","Неон зелёный"], ["#FF10F0","Неон розовый"], ["#FF5F1F","Неон оранжевый"]
  ];

  var STORAGE_KEY = "ams_filament_state_v1";
  var MIGRATION_KEY = "filament_slots_migrated_v2";

  /* ---------- STATE ---------- */
  var spools = [];
  var editingId = null;
  var formBrand = BRANDS[0];
  var formMaterial = "PLA";
  var formShore = "95A";
  var ctxTargetId = null;
  var pendingSlotSpoolId = null;
  var lastAutoColorName = "";
  var formSilk = false;

  /* ---------- PERSISTENCE ---------- */
  function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(spools)); }
  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){ spools = JSON.parse(raw) || []; }
    }catch(e){ spools = []; }

    // One-time migration: in the old AMS the timer was paused; now it runs in slots too.
    try{
      if(!localStorage.getItem(MIGRATION_KEY)){
        spools.forEach(function(sp){ if(sp.inAMS){ sp.lastUpdate = Date.now(); } });
        localStorage.setItem(MIGRATION_KEY, "1");
      }
    }catch(e){}
  }

  /* ---------- HELPERS ---------- */
  function uid(){ return 'sp_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  function fullDurationMs(material){ return (MATERIAL_DAYS[material]||90) * DAY_MS; }

  // The drying timer always counts down — in a slot and in storage alike.
  function getEffectiveRemaining(sp){
    return sp.remainingMs - (Date.now() - sp.lastUpdate);
  }

  function remainingText(sp, long){
    var eff = getEffectiveRemaining(sp);
    if(eff <= 0) return { text: long ? "Требует сушки" : "Сушить", urgent:true };
    var days = eff / DAY_MS;
    if(days < 1){
      var h = Math.max(1, Math.round(eff/3600000));
      return { text: (long ? "Осталось " : "") + h + (long ? " ч." : "ч"), urgent:false };
    }
    var d = Math.ceil(days);
    return { text: (long ? "Осталось " : "") + d + (long ? " дн." : "д"), urgent:false };
  }
  function urgencyColor(sp){
    var eff = getEffectiveRemaining(sp);
    var pct = eff / fullDurationMs(sp.material);
    if(eff <= 0) return "var(--red)";
    if(pct <= 0.15) return "var(--amber)";
    return "var(--green)";
  }
  function materialDisplay(sp){ return sp.material === "TPU" ? ("TPU " + sp.shore) : sp.material; }
  function readableTextColor(hex){
    try{
      var c = hex.replace('#','');
      if(c.length===3){ c = c.split('').map(function(x){return x+x;}).join(''); }
      var r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
      var lum = (0.299*r + 0.587*g + 0.114*b)/255;
      return lum > 0.6 ? '#111114' : '#F5F5F7';
    }catch(e){ return '#F5F5F7'; }
  }
  function toast(msg){
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.style.transform = 'translate(-50%, 0)';
    el.style.opacity = '1';
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){
      el.style.transform = 'translate(-50%, 140%)';
      el.style.opacity = '0';
    }, 2000);
  }

  /* ---------- RENDER ---------- */
  function render(){ renderSlots(); renderStorage(); save(); }

  function spoolCardHTML(sp, big, slotIndex){
    var col = sp.color || '#888';
    var txt = readableTextColor(col);
    var rem = remainingText(sp, big);
    var uColor = urgencyColor(sp);
    var pulse = rem.urgent ? 'pulse-red rounded-xl' : '';

    var brandCls = big ? 'text-[11px]' : 'text-[9px]';
    var matCls   = big ? 'text-[17px]' : 'text-[12px]';
    var badgeCls = big ? 'text-[11px] px-2 py-1' : 'text-[9px] px-1.5 py-0.5';

    return (
      '<div class="spool-card ' + pulse + '" data-id="' + sp.id + '">' +
        '<div class="spool-flange-abs" style="left:2px;"></div>' +
        '<div class="spool-flange-abs" style="right:2px;"></div>' +
        '<div class="info-block" style="background:' + col + '; color:' + txt + ';">' +
          (sp.silk ? '<div class="silk-shine"></div>' : '') +
          (big ? '<div style="position:absolute; top:7px; right:9px; font-size:10px; font-weight:700; opacity:.7;">№' + (slotIndex + 1) + '</div>' : '') +
          (sp.silk ? (big
            ? '<div style="position:absolute; bottom:6px; right:8px; font-size:15px; line-height:1;">✨</div>'
            : '<div style="position:absolute; top:5px; right:6px; font-size:12px; line-height:1;">✨</div>') : '') +
          '<div class="min-w-0">' +
            '<div class="' + brandCls + ' font-semibold leading-tight opacity-80 truncate">' + esc(sp.brand) + '</div>' +
            '<div class="' + matCls + ' font-bold leading-tight truncate">' + materialDisplay(sp) + '</div>' +
            (big && sp.colorName ? '<div class="text-[10px] leading-tight opacity-70 truncate">' + esc(sp.colorName) + '</div>' : '') +
          '</div>' +
          '<div class="' + badgeCls + ' font-semibold rounded-full self-start whitespace-nowrap" style="background:rgba(0,0,0,0.32); color:' + uColor + ';">' + rem.text + '</div>' +
        '</div>' +
      '</div>'
    );
  }

  function renderSlots(){
    var wrap = document.getElementById('slotsGrid');
    var slots = [null,null,null,null];
    spools.forEach(function(sp){
      if(sp.inAMS && sp.amsSlot != null && sp.amsSlot >= 0 && sp.amsSlot < 4){ slots[sp.amsSlot] = sp; }
    });
    var filled = slots.filter(Boolean).length;
    document.getElementById('slotsCount').textContent = filled + ' / 4';

    // DOM order 0..3 + grid-auto-flow:column => 1 top-left, 2 bottom-left, 3 top-right, 4 bottom-right
    wrap.innerHTML = slots.map(function(sp, i){
      if(sp) return spoolCardHTML(sp, true, i);
      return '<div class="empty-slot rounded-2xl flex items-center justify-center text-xs text-center" style="height:130px; color:var(--sub);">Пусто<br>слот ' + (i+1) + '</div>';
    }).join('');

    bindCardEvents(wrap);
  }

  function renderStorage(){
    var zone = document.getElementById('storageZone');
    var list = spools.filter(function(sp){ return !sp.inAMS; });
    list.sort(function(a,b){ return getEffectiveRemaining(a) - getEffectiveRemaining(b); });

    document.getElementById('storageCount').textContent = list.length + (list.length === 1 ? ' катушка' : ' катушек');
    document.getElementById('emptyState').classList.toggle('hidden', list.length !== 0);

    zone.innerHTML = list.map(function(sp){ return spoolCardHTML(sp, false, 0); }).join('');
    bindCardEvents(zone);
  }

  /* ---------- FORM (ADD/EDIT) ---------- */
  var formOverlay = document.getElementById('formOverlay');
  var formSheet = document.getElementById('formSheet');
  var colorInput = document.getElementById('colorInput');
  var hexInput = document.getElementById('hexInput');
  var colorNameInput = document.getElementById('colorName');
  var brandCustomInput = document.getElementById('brandCustom');

  var HEX_RE = /^#([0-9A-Fa-f]{6}|[0-9A-Fa-f]{3})$/;
  function expandHex(v){
    if(v.length === 4){ return '#' + v[1]+v[1] + v[2]+v[2] + v[3]+v[3]; }
    return v;
  }

  function markSelectedSwatch(){
    var cur = (colorInput.value || '').toLowerCase();
    document.querySelectorAll('.palette-swatch').forEach(function(sw){
      sw.classList.toggle('selected', sw.dataset.c.toLowerCase() === cur);
    });
  }

  function setColor(hex){
    colorInput.value = hex;
    hexInput.value = hex.toUpperCase();
    markSelectedSwatch();
  }

  function openForm(spool){
    editingId = spool ? spool.id : null;
    formMaterial = spool ? spool.material : "PLA";
    formShore = spool ? (spool.shore || "95A") : "95A";

    if(spool){
      if(BRANDS.indexOf(spool.brand) !== -1){
        formBrand = spool.brand;
        brandCustomInput.value = "";
      } else {
        formBrand = CUSTOM;
        brandCustomInput.value = spool.brand || "";
      }
    } else {
      formBrand = BRANDS[0];
      brandCustomInput.value = "";
    }

    formSilk = spool ? !!spool.silk : false;
    document.getElementById('formTitle').textContent = spool ? "Изменить катушку" : "Новая катушка";
    setColor(spool ? spool.color : "#FF6A13");
    colorNameInput.value = spool && spool.colorName ? spool.colorName : "";
    lastAutoColorName = "";
    syncFormButtons();

    formOverlay.classList.remove('hidden');
    formSheet.classList.remove('hidden');
    requestAnimationFrame(function(){
      formOverlay.style.opacity = '1';
      formSheet.classList.remove('sheet-hidden');
    });
  }
  function closeForm(){
    formOverlay.style.opacity = '0';
    formSheet.classList.add('sheet-hidden');
    setTimeout(function(){
      formOverlay.classList.add('hidden');
      formSheet.classList.add('hidden');
    }, 380);
  }
  function syncFormButtons(){
    document.querySelectorAll('[data-field="brand"]').forEach(function(b){ b.classList.toggle('active', b.dataset.value === formBrand); });
    document.querySelectorAll('[data-field="material"]').forEach(function(b){ b.classList.toggle('active', b.dataset.value === formMaterial); });
    document.querySelectorAll('[data-field="shore"]').forEach(function(b){ b.classList.toggle('active', b.dataset.value === formShore); });
    document.getElementById('shoreWrap').classList.toggle('hidden', formMaterial !== 'TPU');
    document.getElementById('brandCustomWrap').classList.toggle('hidden', formBrand !== CUSTOM);
    document.getElementById('brandSpacer').classList.toggle('hidden', formBrand === CUSTOM);
    document.getElementById('silkBtn').classList.toggle('active', formSilk);
  }

  document.getElementById('silkBtn').addEventListener('click', function(){
    formSilk = !formSilk;
    syncFormButtons();
  });

  document.querySelectorAll('[data-field="brand"]').forEach(function(b){
    b.addEventListener('click', function(){
      formBrand = b.dataset.value;
      syncFormButtons();
      if(formBrand === CUSTOM){ setTimeout(function(){ brandCustomInput.focus(); }, 50); }
    });
  });
  document.querySelectorAll('[data-field="material"]').forEach(function(b){ b.addEventListener('click', function(){ formMaterial = b.dataset.value; syncFormButtons(); }); });
  document.querySelectorAll('[data-field="shore"]').forEach(function(b){ b.addEventListener('click', function(){ formShore = b.dataset.value; syncFormButtons(); }); });

  // Palette
  (function initPalette(){
    var wrap = document.getElementById('paletteGrid');
    wrap.innerHTML = PALETTE.map(function(p){
      return '<button type="button" class="palette-swatch" title="' + esc(p[1]) + '" data-c="' + p[0] + '" data-n="' + esc(p[1]) + '" style="background:' + p[0] + ';"></button>';
    }).join('');
    wrap.querySelectorAll('.palette-swatch').forEach(function(sw){
      sw.addEventListener('click', function(){
        setColor(sw.dataset.c);
        var cur = colorNameInput.value.trim();
        if(cur === "" || cur === lastAutoColorName){
          colorNameInput.value = sw.dataset.n;
          lastAutoColorName = sw.dataset.n;
        }
      });
    });
  })();

  colorInput.addEventListener('input', function(){
    hexInput.value = this.value.toUpperCase();
    markSelectedSwatch();
  });
  hexInput.addEventListener('input', function(){
    var v = this.value.trim();
    if(v && v.charAt(0) !== '#') v = '#' + v;
    this.value = v.toUpperCase();
    if(HEX_RE.test(v)){
      colorInput.value = expandHex(v);
      markSelectedSwatch();
    }
  });

  document.getElementById('addBtn').addEventListener('click', function(){ openForm(null); });
  document.getElementById('formCancel').addEventListener('click', closeForm);
  formOverlay.addEventListener('click', closeForm);

  document.getElementById('formSave').addEventListener('click', function(){
    var brand = formBrand;
    if(formBrand === CUSTOM){
      brand = brandCustomInput.value.trim();
      if(!brand){ toast('Впишите название бренда'); brandCustomInput.focus(); return; }
    }
    var color = colorInput.value || "#FF6A13";
    var colorName = colorNameInput.value.trim();

    if(editingId){
      var sp = spools.find(function(s){ return s.id === editingId; });
      if(sp){
        var newFull = fullDurationMs(formMaterial);
        var eff = getEffectiveRemaining(sp);
        sp.brand = brand;
        sp.material = formMaterial;
        sp.shore = formMaterial === 'TPU' ? formShore : null;
        sp.color = color;
        sp.colorName = colorName;
        sp.silk = formSilk;
        sp.remainingMs = Math.min(eff, newFull);
        sp.lastUpdate = Date.now();
      }
      toast('Катушка обновлена');
    } else {
      spools.push({
        id: uid(), brand: brand, material: formMaterial,
        shore: formMaterial === 'TPU' ? formShore : null,
        color: color, colorName: colorName, silk: formSilk,
        inAMS: false, amsSlot: null,
        remainingMs: fullDurationMs(formMaterial), lastUpdate: Date.now()
      });
      toast('Катушка добавлена');
    }
    closeForm();
    render();
  });

  /* ---------- CONTEXT MENU ---------- */
  var ctxMenu = document.getElementById('ctxMenu');
  var menuOverlay = document.getElementById('menuOverlay');

  function openMenu(spoolId, anchorRect){
    ctxTargetId = spoolId;
    var sp = spools.find(function(s){ return s.id === spoolId; });
    if(!sp) return;
    document.getElementById('ctxSlotLabel').textContent = sp.inAMS ? 'Убрать из слота' : 'Поместить в слот';

    menuOverlay.classList.remove('hidden');
    ctxMenu.classList.remove('hidden');

    var menuW = 208;
    var vw = window.innerWidth, vh = window.innerHeight;
    var centerX = anchorRect.left + anchorRect.width/2;
    var left;
    if(centerX < vw/2){ left = Math.min(anchorRect.right + 10, vw - menuW - 12); }
    else { left = Math.max(anchorRect.left - menuW - 10, 12); }
    var top = Math.min(anchorRect.top, vh - 230);
    top = Math.max(top, 12);

    ctxMenu.style.left = left + 'px';
    ctxMenu.style.top = top + 'px';

    requestAnimationFrame(function(){
      ctxMenu.style.opacity = '1';
      ctxMenu.style.transform = 'scale(1)';
    });
  }
  function closeMenu(){
    ctxMenu.style.opacity = '0';
    ctxMenu.style.transform = 'scale(.9)';
    setTimeout(function(){
      ctxMenu.classList.add('hidden');
      menuOverlay.classList.add('hidden');
    }, 160);
  }
  menuOverlay.addEventListener('click', closeMenu);

  ctxMenu.querySelectorAll('button[data-action]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var action = btn.dataset.action;
      var sp = spools.find(function(s){ return s.id === ctxTargetId; });
      closeMenu();
      if(!sp) return;

      if(action === 'delete'){
        spools = spools.filter(function(s){ return s.id !== sp.id; });
        toast('Катушка удалена');
        render();
      } else if(action === 'edit'){
        openForm(sp);
      } else if(action === 'dry'){
        sp.remainingMs = fullDurationMs(sp.material);
        sp.lastUpdate = Date.now();
        toast('Катушка просушена');
        render();
      } else if(action === 'slot'){
        if(sp.inAMS){
          moveToStorage(sp.id);
          toast('Убрано из слота');
          render();
        } else {
          placeFromMenu(sp.id);
        }
      }
    });
  });

  /* ---------- SLOT PLACEMENT LOGIC ---------- */
  function moveToStorage(id){
    var sp = spools.find(function(s){ return s.id === id; });
    if(!sp) return;
    sp.inAMS = false;
    sp.amsSlot = null;
  }

  function placeInSlot(id, slotIndex){
    var occupant = spools.find(function(s){ return s.inAMS && s.amsSlot === slotIndex && s.id !== id; });
    if(occupant){ moveToStorage(occupant.id); }
    var sp = spools.find(function(s){ return s.id === id; });
    sp.inAMS = true;
    sp.amsSlot = slotIndex;
  }

  // Context-menu "Поместить в слот" (no drop position available)
  function placeFromMenu(id){
    var occupied = [false,false,false,false];
    spools.forEach(function(s){ if(s.inAMS && s.amsSlot != null){ occupied[s.amsSlot] = true; } });
    var emptySlots = [];
    occupied.forEach(function(v,i){ if(!v) emptySlots.push(i); });

    if(emptySlots.length > 0){
      placeInSlot(id, emptySlots[0]);
      toast('Катушка в слоте ' + (emptySlots[0] + 1));
      render();
    } else {
      openSlotPicker(id);
    }
  }

  // Drag & drop: nearest slot under the pointer. Occupied slot => swap (slot<->slot)
  // or direct replacement (storage->slot), no dialog.
  function resolveSlotDrop(id, targetSlot){
    var dragged = spools.find(function(s){ return s.id === id; });
    if(!dragged) return;
    var occupant = spools.find(function(s){ return s.inAMS && s.amsSlot === targetSlot && s.id !== id; });
    var wasInSlot = dragged.inAMS;
    var originSlot = dragged.amsSlot;

    if(occupant){
      if(wasInSlot && originSlot != null){
        occupant.amsSlot = originSlot;
      } else {
        moveToStorage(occupant.id);
      }
    }
    dragged.inAMS = true;
    dragged.amsSlot = targetSlot;
  }

  // 2D nearest: slots are laid out in a 2x2 grid
  function nearestSlotIndex(x, y){
    var slotEls = document.querySelectorAll('#slotsGrid > div');
    var best = 0, bestDist = Infinity;
    slotEls.forEach(function(el, i){
      var r = el.getBoundingClientRect();
      var cx = r.left + r.width/2, cy = r.top + r.height/2;
      var d = (cx - x)*(cx - x) + (cy - y)*(cy - y);
      if(d < bestDist){ bestDist = d; best = i; }
    });
    return best;
  }

  function dropOntoSlots(id, x, y){
    var dragged = spools.find(function(s){ return s.id === id; });
    if(!dragged) { render(); return; }
    var slot = nearestSlotIndex(x, y);
    var wasInSlot = dragged.inAMS;
    if(wasInSlot && dragged.amsSlot === slot){ render(); return; }
    resolveSlotDrop(id, slot);
    toast(wasInSlot ? 'Слоты обновлены' : 'Катушка в слоте ' + (slot + 1));
    render();
  }

  /* ---------- SLOT PICKER MODAL (menu-only fallback) ---------- */
  var slotPickerOverlay = document.getElementById('slotPickerOverlay');
  var slotPickerModal = document.getElementById('slotPickerModal');

  function openSlotPicker(newSpoolId){
    pendingSlotSpoolId = newSpoolId;
    var list = document.getElementById('slotPickerList');
    var html = '';
    for(var i=0;i<4;i++){
      var occ = spools.find(function(s){ return s.inAMS && s.amsSlot === i; });
      html += '<button data-slot="' + i + '" class="btn-press flex items-center justify-between px-4 py-3 rounded-2xl text-sm glass">' +
        '<span>Слот ' + (i+1) + '</span>' +
        '<span style="color:var(--sub)">' + (occ ? (esc(occ.brand) + ' · ' + materialDisplay(occ)) : 'Пусто') + '</span>' +
      '</button>';
    }
    list.innerHTML = html;
    list.querySelectorAll('button[data-slot]').forEach(function(b){
      b.addEventListener('click', function(){
        var slot = parseInt(b.dataset.slot, 10);
        placeInSlot(pendingSlotSpoolId, slot);
        toast('Катушка заменена в слоте ' + (slot+1));
        closeSlotPicker();
        render();
      });
    });
    slotPickerOverlay.classList.remove('hidden');
    slotPickerModal.classList.remove('hidden');
    slotPickerModal.classList.add('flex');
    requestAnimationFrame(function(){ slotPickerOverlay.style.opacity = '1'; });
  }
  function closeSlotPicker(){
    slotPickerOverlay.style.opacity = '0';
    setTimeout(function(){
      slotPickerOverlay.classList.add('hidden');
      slotPickerModal.classList.add('hidden');
      slotPickerModal.classList.remove('flex');
    }, 200);
    pendingSlotSpoolId = null;
  }
  document.getElementById('slotPickerCancel').addEventListener('click', closeSlotPicker);
  slotPickerOverlay.addEventListener('click', closeSlotPicker);

  /* ---------- DRAG & DROP (Pointer Events, iOS-friendly) ---------- */
  var ARM_DELAY = 160;
  var MOVE_THRESHOLD = 10;

  var drag = {
    active:false, armed:false, canceled:false, scrolling:false,
    id:null, startX:0, startY:0, startTime:0, prevY:0,
    timer:null, clone:null, origEl:null, offsetX:0, offsetY:0
  };

  function bindCardEvents(container){
    container.querySelectorAll('.spool-card').forEach(function(card){
      card.addEventListener('pointerdown', onPointerDown);
    });
  }

  function onPointerDown(e){
    if(e.button !== undefined && e.button !== 0) return;
    var card = e.currentTarget;
    drag.id = card.dataset.id;
    drag.startX = e.clientX; drag.startY = e.clientY;
    drag.prevY = e.clientY;
    drag.startTime = Date.now();
    drag.armed = false; drag.active = false; drag.canceled = false; drag.scrolling = false;
    drag.origEl = card;

    clearTimeout(drag.timer);
    drag.timer = setTimeout(function(){
      if(!drag.canceled){
        drag.armed = true;
        card.classList.add('card-armed');
        if(navigator.vibrate) navigator.vibrate(8);
      }
    }, ARM_DELAY);

    document.addEventListener('pointermove', onPointerMove);
    document.addEventListener('pointerup', onPointerUp);
    document.addEventListener('pointercancel', onPointerUp);
  }

  function onPointerMove(e){
    if(!drag.id) return;
    var dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
    var dist = Math.sqrt(dx*dx + dy*dy);

    if(!drag.armed && !drag.active){
      // Cards use touch-action:none, so the browser never scrolls them natively —
      // once movement looks like a swipe (before the long-press arms), scroll manually.
      if(drag.scrolling){
        window.scrollBy(0, drag.prevY - e.clientY);
        drag.prevY = e.clientY;
        return;
      }
      if(dist > MOVE_THRESHOLD){
        drag.canceled = true;
        drag.scrolling = true;
        clearTimeout(drag.timer);
        if(drag.origEl) drag.origEl.classList.remove('card-armed');
        window.scrollBy(0, drag.prevY - e.clientY);
        drag.prevY = e.clientY;
      }
      return;
    }
    if(drag.armed && !drag.active){ startDrag(e); }
    if(drag.active){ e.preventDefault(); moveDrag(e); }
  }

  function startDrag(e){
    drag.active = true;
    var card = drag.origEl;
    card.classList.remove('card-armed');
    var rect = card.getBoundingClientRect();
    drag.offsetX = rect.width/2;
    drag.offsetY = rect.height/2;

    var clone = card.cloneNode(true);
    clone.classList.add('drag-clone');
    clone.style.width = rect.width + 'px';
    clone.style.height = rect.height + 'px';
    clone.style.left = (e.clientX - drag.offsetX) + 'px';
    clone.style.top = (e.clientY - drag.offsetY) + 'px';
    clone.style.transform = 'scale(1.08) rotate(-2deg)';
    document.body.appendChild(clone);
    drag.clone = clone;

    card.classList.add('card-ghost');
    document.getElementById('slotsZone').classList.add('drop-highlight');
    document.getElementById('storageZone').classList.add('drop-highlight');
  }

  function moveDrag(e){
    if(!drag.clone) return;
    drag.clone.style.left = (e.clientX - drag.offsetX) + 'px';
    drag.clone.style.top = (e.clientY - drag.offsetY) + 'px';
  }

  function onPointerUp(e){
    document.removeEventListener('pointermove', onPointerMove);
    document.removeEventListener('pointerup', onPointerUp);
    document.removeEventListener('pointercancel', onPointerUp);
    clearTimeout(drag.timer);

    if(drag.active){
      finishDrag(e);
    } else if(!drag.canceled && drag.id){
      var dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
      var dist = Math.sqrt(dx*dx + dy*dy);
      if(dist < MOVE_THRESHOLD){
        var el = drag.origEl;
        el.classList.remove('card-armed');
        openMenu(drag.id, el.getBoundingClientRect());
      }
    }

    if(drag.origEl){
      drag.origEl.classList.remove('card-armed');
      drag.origEl.classList.remove('card-ghost');
    }
    document.getElementById('slotsZone').classList.remove('drop-highlight');
    document.getElementById('storageZone').classList.remove('drop-highlight');

    drag = { active:false, armed:false, canceled:false, scrolling:false, id:null, startX:0, startY:0, startTime:0, prevY:0, timer:null, clone:null, origEl:null, offsetX:0, offsetY:0 };
  }

  function finishDrag(e){
    var id = drag.id;
    if(drag.clone && drag.clone.parentNode){ drag.clone.parentNode.removeChild(drag.clone); }

    var el = document.elementFromPoint(e.clientX, e.clientY);
    var zone = el ? el.closest('[data-dropzone]') : null;
    var sp = spools.find(function(s){ return s.id === id; });
    if(!sp || !zone){ render(); return; }

    var type = zone.dataset.dropzone;
    if(type === 'slots'){
      dropOntoSlots(id, e.clientX, e.clientY);
    } else if(type === 'storage'){
      if(sp.inAMS){
        moveToStorage(id);
        toast('Катушка перемещена на склад');
      }
      render();
    } else {
      render();
    }
  }

  /* ---------- INIT ---------- */
  load();
  render();
  setInterval(function(){ if(!drag.id){ render(); } }, 60000);

})();
</script>
</body>
</html>
